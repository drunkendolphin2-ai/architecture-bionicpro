x-airflow-common: &airflow-common
  build:
    context: ./etl
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_local_secret'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # подключение к CRM: переменная сама создаёт connection id "crm_db"
    AIRFLOW_CONN_CRM_DB: 'postgresql://crm_user:crm_password@crm_db:5432/crm_db'
    # ClickHouse читаем через clickhouse-driver
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: '9000'
    CLICKHOUSE_DB: bionic
    CLICKHOUSE_USER: bionic
    CLICKHOUSE_PASSWORD: bionic
  volumes:
    - ./etl/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ---------- источники и приёмник ----------

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: bionic
      CLICKHOUSE_USER: bionic
      CLICKHOUSE_PASSWORD: bionic
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./etl/clickhouse-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  crm_db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm-data:/var/lib/postgresql/data
      - ./etl/crm-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- airflow ----------

  airflow_db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow_db:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin --password admin
      --firstname admin --lastname admin
      --role Admin --email admin@bionicpro.local
      || true
      "

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      crm_db:
        condition: service_healthy
    command: scheduler
    restart: always

volumes:
  clickhouse-data:
  crm-data:
  airflow-db-data:
  airflow-logs: